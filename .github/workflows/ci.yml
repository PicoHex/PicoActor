# PicoActor CI — validation pipeline
# Tier 2: source-generator library (PicoActor.Abs + PicoActor.Gen + PicoActor)
# Gen is embedded in the Abs package; tests exercise the generated bridge code.
# Runs on PR and push to main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Formatting — repo-wide, no path filter: cheap and catches every PR.
  # CSharpier (pinned as a local tool in .config/dotnet-tools.json) owns code
  # formatting; .editorconfig/.gitattributes keep indent, charset and LF stable.
  # ---------------------------------------------------------------------------
  format:
    name: Format (CSharpier)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore local tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

  build:
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64]
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}
    name: build ${{ matrix.rid }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Linux AOT prerequisites
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      # Local folder feed (NuGet.config: local -> artifacts/nupkg) must exist
      # before restore or NuGet fails with NU1301.
      - name: Prepare local feed
        shell: bash
        run: mkdir -p artifacts/nupkg

      - name: Restore
        run: dotnet restore PicoActor.slnx -p:UseProjectReferences=true

      - name: Build
        run: dotnet build PicoActor.slnx --no-restore -c Release -p:UseProjectReferences=true

      - name: Test PicoActor.Abs
        run: dotnet test --project tests/PicoActor.Abs.Tests/PicoActor.Abs.Tests.csproj --no-build -c Release

      - name: Test PicoActor
        run: dotnet test --project tests/PicoActor.Tests/PicoActor.Tests.csproj --no-build -c Release

      # The sample declares AotOptimizationLevel=aggressive (minimal tier +
      # size levers) in its csproj; Abs/Gen guard against inherited PublishAot
      # via the netstandard2.0 guard block and TreatAsLocalProperty.
      #
      # The solution restore above is RID-less, so the sample's assets have no
      # net10.0/<rid> target — the no-restore publish below would fail with
      # NETSDK1047. Restore the publish graph with the matrix RID first.
      - name: Restore (AOT RID)
        run: >
          dotnet restore samples/PicoActor.Sample/PicoActor.Sample.csproj
          -r ${{ matrix.rid }}
          -p:UseProjectReferences=true

      - name: AOT publish (Counter sample)
        run: >
          dotnet publish samples/PicoActor.Sample/PicoActor.Sample.csproj
          --no-restore -c Release -r ${{ matrix.rid }}
          --self-contained
          -o publish/${{ matrix.rid }}
