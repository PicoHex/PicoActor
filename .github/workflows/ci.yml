# PicoActor CI — validation pipeline
# Tier 2: source-generator library (PicoActor.Abs + PicoActor.Gen + PicoActor) plus the
# store family (PicoActor.EventStore.InMemory, PicoActor.EventStore.Jsonl and the
# PicoActor.EventStore.Gen analyzer embedded in the Jsonl package).
# Gen is embedded in the Abs package; tests exercise the generated bridge code.
# Runs on PR and push to main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: 11.0.x
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Formatting — repo-wide, no path filter: cheap and catches every PR.
  # CSharpier (pinned as a local tool in .config/dotnet-tools.json) owns code
  # formatting; .editorconfig/.gitattributes keep indent, charset and LF stable.
  # ---------------------------------------------------------------------------
  format:
    name: Format (CSharpier)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore local tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

  build:
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64]
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}
    name: build ${{ matrix.rid }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Linux AOT prerequisites
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      # Local folder feed (NuGet.config: local -> artifacts/nupkg) must exist
      # before restore or NuGet fails with NU1301.
      - name: Prepare local feed
        shell: bash
        run: mkdir -p artifacts/nupkg

      # No locked mode: nothing is committed to lock AGAINST. The declarations in
      # Directory.Packages.props float on purpose, and the packages.lock.json a restore
      # writes is a local record of what this leg resolved -- gitignored, never reviewed,
      # never replayed. The record still has to survive the run, so it leaves as the
      # `resolved-versions` artifact uploaded below.
      #
      # This restore is deliberately RID-NEUTRAL and must stay that way: PublishAot
      # would otherwise have the SDK infer the host publish RID at restore time and
      # bake a "net10.0/<host-rid>" group into the lock file beside each project
      # (UseDefaultPublishRuntimeIdentifier=false in Directory.Build.props). Nothing is
      # committed any more, so a RID group can no longer reach a review, but neutrality
      # is what keeps this restore comparable with a restore on any other machine.
      # Consequence: NO RID-specific assets are produced here, so the AOT publish below
      # must not use the no-restore flag — it would fail with NETSDK1047 (no target for
      # net10.0/<rid>).
      - name: Restore
        run: dotnet restore PicoActor.slnx -p:UseProjectReferences=true

      - name: Build
        run: dotnet build PicoActor.slnx --no-restore -c Release -p:UseProjectReferences=true

      # The resolved versions, as data instead of as a committed file. Restore writes
      # `packages.lock.json` beside every project (RestorePackagesWithLockFile=true in
      # Directory.Build.props) and .gitignore keeps it out of the tree; uploading it here
      # is what makes "which exact versions did this build use" answerable after the
      # runner is gone -- the one job the tracked lock used to do.
      # `if: always()` on purpose: a leg that fails after restore still produced a
      # resolution, and that is exactly the run somebody needs to inspect.
      - name: Upload resolved versions (restore record)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-versions-${{ matrix.rid }}
          path: |
            **/packages.lock.json
          if-no-files-found: error
          retention-days: 30

      - name: Test PicoActor.Abs
        run: dotnet test --project tests/PicoActor.Abs.Tests/PicoActor.Abs.Tests.csproj --no-build -c Release

      - name: Test PicoActor
        run: dotnet test --project tests/PicoActor.Tests/PicoActor.Tests.csproj --no-build -c Release

      # The store family moved out of the core package: each store ships its own
      # conformance/behaviour suite, and the analyzer that guards [PicoDerivedType]
      # registration has its own project. All four run from the same Release build.
      - name: Test PicoActor.EventStore.InMemory
        run: dotnet test --project tests/PicoActor.EventStore.InMemory.Tests/PicoActor.EventStore.InMemory.Tests.csproj --no-build -c Release

      - name: Test PicoActor.EventStore.Jsonl
        run: dotnet test --project tests/PicoActor.EventStore.Jsonl.Tests/PicoActor.EventStore.Jsonl.Tests.csproj --no-build -c Release

      - name: Test PicoActor.EventStore.Gen
        run: dotnet test --project tests/PicoActor.EventStore.Gen.Tests/PicoActor.EventStore.Gen.Tests.csproj --no-build -c Release

      # The sample declares AotOptimizationLevel=aggressive (minimal tier +
      # size levers) in its csproj; Abs/Gen guard against inherited PublishAot
      # via the netstandard2.0 guard block and TreatAsLocalProperty.
      #
      # The restore above is RID-neutral, so this publish restores ITS OWN RID
      # (no no-restore flag — the net10.0/<rid> target does not exist yet and
      # publishing would fail with NETSDK1047). Same shape as the PicoNode / PicoSerDe /
      # PicoAgent AOT steps.
      #
      # That implicit restore REPLACES the runtime section of the sample's
      # packages.lock.json (it does not accumulate RIDs), which is now simply what a
      # local record looks like: the file is not compared against anything. It stays on
      # the runner because .gitignore keeps it out of the tree, so no commit can carry a
      # `net10.0/<rid>` group.
      #
      # -f net10.0 is REQUIRED, not cosmetic: the sample is multi-targeted
      # (net10.0;net11.0), and `dotnet publish` on a multi-targeted project without
      # an explicit framework fails with NETSDK1129 "the project does not have a
      # single target framework". Pinning the framework also keeps the published
      # artifact byte-identical to the pre-multi-target one (net10.0 AOT), so the
      # native smoke run below still validates the same code path.
      - name: AOT publish (Counter sample)
        run: >
          dotnet publish samples/PicoActor.Sample/PicoActor.Sample.csproj
          -f net10.0
          -c Release -r ${{ matrix.rid }}
          --self-contained
          -o publish/${{ matrix.rid }}

      # The managed test runs above never touch the AOT artifact: `dotnet test` is a JIT
      # run, so a source-generated registration that ILC trimmed away is invisible to
      # them. Running the native binary is the only check that sees it — the sample walks
      # the whole stack (DI registration, actor loop, event-sourced rebuild, saga, mediator
      # outflow), so a trimmed registration fails here instead of in a consumer app.
      # Cheap: the run itself is ~1 s (measured locally on win-x64).
      #
      # Cross-RID name: the Windows RIDs append `.exe`, the other RIDs publish an
      # extensionless ELF/Mach-O. `publish/<rid>/` holds PicoActor.Sample[.exe] plus
      # symbols only — no companion DLL to stage, so the binary is runnable as published.
      # A failing run (non-zero exit) or a truncated flow (missing "=== Done ===") fails
      # the job: this is a gate, not a demo. The sample does not merely PRINT its key
      # observations — the generated subscribers receiving their events, the saga loopback
      # stopping itself, the recovery classification, the event-sourced version — it ASSERTS
      # them and exits 1 on any mismatch, so a registration trimmed away by ILC fails the job
      # instead of printing "0" next to a Done marker.
      - name: Run AOT sample (native binary)
        # A hung binary must not sit on the job's 45-minute budget: the sample's own
        # waits are bounded (10 s each) and the run itself takes ~1 s, so 5 minutes is
        # already an order of magnitude of headroom.
        timeout-minutes: 5
        shell: bash
        run: |
          # pipefail: without it the pipeline's status is `grep`'s, so a binary that
          # crashes AFTER printing the Done marker would still pass this gate.
          set -euo pipefail

          dir="publish/${{ matrix.rid }}"
          exe="$dir/PicoActor.Sample"
          case "${{ matrix.rid }}" in
            win-*) exe="$exe.exe" ;;
          esac

          if [ ! -f "$exe" ]; then
            echo "::error::native AOT binary not found: $exe"
            ls -la "$dir" || true
            exit 1
          fi

          "$exe" | tee aot-sample.log
          grep -q "=== Done ===" aot-sample.log

  # ---------------------------------------------------------------------------
  # Package smoke — the PACKAGED surface must be consumable, and the store must be its
  # OWN package (C1 + C2 regression guards: scripts/verify-package.sh). Independent of
  # the unit-test matrix on purpose: it packs three packages in Release and restores
  # three throwaway probe projects (two positive, one negative), which is minutes the
  # per-RID build job should not pay.
  # Needs `unzip` (the script unpacks the nuspec; preinstalled on ubuntu-latest).
  # ---------------------------------------------------------------------------
  package-smoke:
    name: Package smoke (packaged surface)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify packaged surface (PicoActor + store package, and the no-store throw)
        run: bash scripts/verify-package.sh

  # Dependency policy gate (R1-R7, R7b, R10 of picohex-dependency-policy).
  # The checker is vendored: scripts/check-dependency-policy.sh carries the same
  # bytes in every PicoHex repo and names the canonical source in its header.
  policy:
    name: dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check the dependency policy
        run: bash scripts/check-dependency-policy.sh .
