# PicoActor Release — NuGet publish
# Tier 2 embedded-generator pack order: Abs embeds Gen (IsPackable=false),
# then the Impl package consumes Abs from the staged local feed.
# Triggered by tags shaped like v*

name: Release

on:
  push:
    tags: [v*]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    # Least privilege: only the release job needs to write (GH release upload)
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      # Pack in dependency order with UseProjectReferences=false.
      # Abs's ProjectReference to Gen is unconditional, so Gen builds first
      # and its DLL is embedded into the Abs package (embedded-generator
      # pattern); PicoActor then consumes Abs via PackageReference from the
      # staged local feed.

      - name: Prepare local feed
        shell: bash
        run: |
          rm -rf artifacts/nupkg
          mkdir -p artifacts/nupkg

      - name: Pack PicoActor.Abs
        run: >
          dotnet pack src/PicoActor.Abs/PicoActor.Abs.csproj
          -c Release -p:Version=${{ env.PACKAGE_VERSION }}
          -p:UseProjectReferences=false
          -o artifacts/nupkg

      - name: Pack PicoActor
        run: >
          dotnet pack src/PicoActor/PicoActor.csproj
          -c Release -p:Version=${{ env.PACKAGE_VERSION }}
          -p:UseProjectReferences=false
          -p:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts/nupkg
          -o artifacts/nupkg

      - name: Publish to NuGet
        shell: bash
        working-directory: artifacts/nupkg
        run: |
          for file in *.nupkg; do
            if [[ "$file" != *.snupkg ]] && [[ "$file" != *.symbols.nupkg ]]; then
              dotnet nuget push "$file" \
                --api-key "${{ secrets.NUGET_API_KEY }}" \
                --source https://api.nuget.org/v3/index.json \
                --skip-duplicate
            fi
          done

      - name: Upload packages as release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            artifacts/nupkg/*.nupkg
            artifacts/nupkg/*.snupkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/nupkg/*.nupkg
