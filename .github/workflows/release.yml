# PicoActor Release — NuGet publish
# Triggered by tags shaped like v*

name: release

on:
  push:
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      # Pack in dependency order with UseProjectReferences=false.
      # Each csproj uses conditional ItemGroup to select between
      # ProjectReference (dev) and PackageReference (pack/release).

      - name: Pack PicoActor.Abs
        run: >
          dotnet pack src/PicoActor.Abs/PicoActor.Abs.csproj
          -c Release -p:Version=${{ env.PACKAGE_VERSION }}
          -p:UseProjectReferences=false
          -o packages

      - name: Pack PicoActor
        run: >
          dotnet pack src/PicoActor/PicoActor.csproj
          -c Release -p:Version=${{ env.PACKAGE_VERSION }}
          -p:UseProjectReferences=false
          -p:RestoreAdditionalProjectSources=${{ github.workspace }}/packages
          -o packages

      - name: Publish to NuGet
        shell: bash
        working-directory: packages
        run: |
          for file in *.nupkg; do
            if [[ "$file" != *.snupkg ]] && [[ "$file" != *.symbols.nupkg ]]; then
              dotnet nuget push "$file" \
                --api-key "${{ secrets.NUGET_API_KEY }}" \
                --source https://api.nuget.org/v3/index.json \
                --skip-duplicate
            fi
          done

      - name: Upload packages as release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: packages/*.nupkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: packages/*.nupkg
